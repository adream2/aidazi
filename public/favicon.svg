  <rect x="11.4" y="23.6" width="4.1" height="3" rx="0.9" fill="#fffdfa" opacity=".58"/>
  <rect x="16.5" y="23.6" width="4.1" height="3" rx="0.9" fill="#fffdfa" opacity=".58"/>
  <rect x="21.6" y="23.6" width="4.1" height="3" rx="0.9" fill="#fffdfa" opacity=".58"/>
</svg>
