server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/html
               application/manifest+json text/plain application/xml;
    gzip_min_length 1024;

    # PWA manifest（nginx 默认 mime 表没有 webmanifest，此处追加类型，与主配置的 mime.types 合并）
    types {
        application/manifest+json webmanifest;
        image/x-icon ico;
    }

    # 单页回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，保证更新立即可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源短缓存
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
